<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Business Tool Manager</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5.3 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome 6 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-bg d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
                <div class="card auth-card shadow-lg border-0 rounded-4">
                    <div class="card-body p-4 p-sm-5">
                        <!-- Brand Header -->
                        <div class="text-center mb-4">
                            <div class="auth-brand-icon mb-2">
                                <i class="fa-solid fa-briefcase"></i>
                            </div>
                            <h3 class="fw-bold text-dark m-0">Create Account</h3>
                            <p class="text-muted small">Join BizTools to streamline your operations</p>
                        </div>

                        <!-- Flash Error / Success Messages -->
                        <div th:if="${error != null or errorMessage != null}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center mb-3 py-2 px-3" role="alert">
                            <i class="fa-solid fa-circle-exclamation me-2"></i>
                            <div class="small" th:text="${error != null ? error : errorMessage}">An error occurred during registration.</div>
                            <button type="button" class="btn-close ms-auto p-2" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <div th:if="${success != null or successMessage != null}" class="alert alert-success alert-dismissible fade show d-flex align-items-center mb-3 py-2 px-3" role="alert">
                            <i class="fa-solid fa-circle-check me-2"></i>
                            <div class="small" th:text="${success != null ? success : successMessage}">Account created successfully!</div>
                            <button type="button" class="btn-close ms-auto p-2" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <!-- Registration Form -->
                        <form th:action="@{/register}" th:object="${user}" method="post" class="needs-validation" novalidate>
                            <!-- Hidden CSRF token -->
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>

                            <!-- Full Name Field -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label text-dark fw-medium small">Full Name</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted">
                                        <i class="fa-solid fa-id-card"></i>
                                    </span>
                                    <input type="text" class="form-control border-start-0 ps-0" id="fullName" 
                                           th:field="*{fullName}" placeholder="e.g. John Doe" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                            </div>

                            <!-- Username Field -->
                            <div class="mb-3">
                                <label for="username" class="form-label text-dark fw-medium small">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted">
                                        <i class="fa-solid fa-user"></i>
                                    </span>
                                    <input type="text" class="form-control border-start-0 ps-0" id="username" 
                                           th:field="*{username}" placeholder="Choose a username" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                            </div>

                            <!-- Email Field -->
                            <div class="mb-3">
                                <label for="email" class="form-label text-dark fw-medium small">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted">
                                        <i class="fa-solid fa-envelope"></i>
                                    </span>
                                    <input type="email" class="form-control border-start-0 ps-0" id="email" 
                                           th:field="*{email}" placeholder="you@company.com" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>

                            <!-- Password Field -->
                            <div class="mb-3">
                                <label for="password" class="form-label text-dark fw-medium small">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted">
                                        <i class="fa-solid fa-lock"></i>
                                    </span>
                                    <input type="password" class="form-control border-start-0 ps-0" id="password" 
                                           th:field="*{password}" placeholder="Create password" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                            </div>

                            <!-- Confirm Password Field -->
                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label text-dark fw-medium small">Confirm Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted">
                                        <i class="fa-solid fa-shield-halved"></i>
                                    </span>
                                    <input type="password" class="form-control border-start-0 ps-0" id="confirmPassword" 
                                           th:field="*{confirmPassword}" placeholder="Repeat password" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                            </div>

                            <!-- Register Button -->
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary btn-lg fw-semibold shadow-sm register-btn">
                                    <i class="fa-solid fa-user-plus me-2"></i>Register
                                </button>
                            </div>

                            <!-- Login Link -->
                            <div class="text-center">
                                <span class="text-muted small">Already have an account? </span>
                                <a th:href="@{/login}" class="text-primary small fw-semibold text-decoration-none hover-underline">
                                    Sign In here
                                </a>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Footer note -->
                <div class="text-center mt-4 text-white-50 small">
                    &copy; 2026 BizTools. All rights reserved.
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
