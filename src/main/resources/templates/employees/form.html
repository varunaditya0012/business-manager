<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
      layout:decorate="~{layout}">
<head>
    <title th:text="${employee.id == null ? 'Add Employee' : 'Edit Employee'}">Employee Form</title>
</head>
<body>
    <div layout:fragment="content">
        <!-- Form Header -->
        <div class="d-flex align-items-center justify-content-between mb-4">
            <div>
                <a th:href="@{/employees}" class="btn btn-outline-secondary btn-sm mb-2">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to Directory
                </a>
                <h2 class="fw-bold text-dark mb-1" th:text="${employee.id == null ? 'Add New Employee' : 'Edit Employee'}">Employee Form</h2>
                <p class="text-muted mb-0">Enter employee records and organizational assignments</p>
            </div>
        </div>

        <!-- Form Card -->
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="card border-0 rounded-4 shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <form th:action="@{/employees/save}" th:object="${employee}" method="post" class="needs-validation" novalidate>
                            <!-- Hidden inputs for ID and CSRF -->
                            <input type="hidden" th:field="*{id}" />
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>

                            <!-- First Name & Last Name -->
                            <div class="row g-3 mb-4">
                                <div class="col-12 col-md-6">
                                    <label for="firstName" class="form-label fw-semibold text-dark">First Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="firstName" th:field="*{firstName}" 
                                           placeholder="e.g. Jane" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="lastName" class="form-label fw-semibold text-dark">Last Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="lastName" th:field="*{lastName}" 
                                           placeholder="e.g. Doe" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                                </div>
                            </div>

                            <!-- Email and Phone -->
                            <div class="row g-3 mb-4">
                                <div class="col-12 col-md-6">
                                    <label for="email" class="form-label fw-semibold text-dark">Email Address <span class="text-danger">*</span></label>
                                    <input type="email" class="form-control" id="email" th:field="*{email}" 
                                           placeholder="jane.doe@company.com" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="phone" class="form-label fw-semibold text-dark">Phone Number</label>
                                    <input type="tel" class="form-control" id="phone" th:field="*{phone}" 
                                           placeholder="+1 (555) 000-0000">
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                                </div>
                            </div>

                            <!-- Department and Position -->
                            <div class="row g-3 mb-4">
                                <div class="col-12 col-md-6">
                                    <label for="department" class="form-label fw-semibold text-dark">Department <span class="text-danger">*</span></label>
                                    <select class="form-select" id="department" th:field="*{department}" required>
                                        <option value="" disabled selected>Select department</option>
                                        <option value="Engineering">Engineering</option>
                                        <option value="Marketing">Marketing</option>
                                        <option value="Sales">Sales</option>
                                        <option value="HR">HR</option>
                                        <option value="Finance">Finance</option>
                                        <option value="Operations">Operations</option>
                                        <option value="Support">Support</option>
                                        <option value="Management">Management</option>
                                    </select>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="position" class="form-label fw-semibold text-dark">Position / Job Title <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="position" th:field="*{position}" 
                                           placeholder="e.g. Senior Software Architect" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('position')}" th:errors="*{position}"></div>
                                </div>
                            </div>

                            <!-- Salary, Hire Date, and Status -->
                            <div class="row g-3 mb-4">
                                <div class="col-12 col-md-4">
                                    <label for="salary" class="form-label fw-semibold text-dark">Annual Salary (USD)</label>
                                    <div class="input-group">
                                        <span class="input-group-text">$</span>
                                        <input type="number" step="0.01" min="0" class="form-control" id="salary" 
                                               th:field="*{salary}" placeholder="85000.00">
                                    </div>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
                                </div>
                                <div class="col-12 col-md-4">
                                    <label for="hireDate" class="form-label fw-semibold text-dark">Hire Date</label>
                                    <input type="date" class="form-control" id="hireDate" th:field="*{hireDate}">
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('hireDate')}" th:errors="*{hireDate}"></div>
                                </div>
                                <div class="col-12 col-md-4">
                                    <label for="status" class="form-label fw-semibold text-dark">Status <span class="text-danger">*</span></label>
                                    <select class="form-select" id="status" th:field="*{status}" required>
                                        <option value="ACTIVE">ACTIVE</option>
                                        <option value="INACTIVE">INACTIVE</option>
                                        <option value="ON_LEAVE">ON_LEAVE</option>
                                        <option value="TERMINATED">TERMINATED</option>
                                    </select>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                                </div>
                            </div>

                            <hr class="my-4 text-muted">

                            <!-- Action Buttons -->
                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/employees}" class="btn btn-outline-secondary px-4">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                    <i class="fa-solid fa-floppy-disk me-1"></i> Save Employee
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
