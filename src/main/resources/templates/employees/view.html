<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
      layout:decorate="~{layout}">
<head>
    <title th:text="${employee.firstName + ' ' + employee.lastName + ' - Profile'}">Employee Profile</title>
</head>
<body>
    <div layout:fragment="content">
        <!-- Breadcrumb / Back button -->
        <div class="mb-4">
            <a th:href="@{/employees}" class="btn btn-outline-secondary btn-sm">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Employees List
            </a>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <!-- Employee Detail Card -->
                <div class="card border-0 rounded-4 shadow-sm overflow-hidden">
                    <div class="card-header bg-white border-0 pt-4 px-4 pb-0 d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3">
                        <div class="d-flex align-items-center gap-3">
                            <div class="avatar-lg bg-primary-subtle text-primary rounded-circle d-flex align-items-center justify-content-center fw-bold fs-4"
                                 style="width: 64px; height: 64px;"
                                 th:text="${(employee.firstName != null and !#strings.isEmpty(employee.firstName) ? employee.firstName.substring(0,1) : '') + (employee.lastName != null and !#strings.isEmpty(employee.lastName) ? employee.lastName.substring(0,1) : '')}">
                                JD
                            </div>
                            <div>
                                <h3 class="fw-bold text-dark mb-1" th:text="${employee.firstName + ' ' + employee.lastName}">Jane Doe</h3>
                                <div class="d-flex align-items-center gap-2">
                                    <span class="badge bg-light text-dark border" th:text="${employee.position}">Position</span>
                                    <span th:if="${employee.status != null and employee.status.name() == 'ACTIVE'}" class="badge bg-success">Active</span>
                                    <span th:if="${employee.status != null and employee.status.name() == 'INACTIVE'}" class="badge bg-danger">Inactive</span>
                                    <span th:if="${employee.status != null and employee.status.name() == 'ON_LEAVE'}" class="badge bg-warning text-dark">On Leave</span>
                                    <span th:if="${employee.status != null and employee.status.name() == 'TERMINATED'}" class="badge bg-secondary">Terminated</span>
                                </div>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="d-flex gap-2">
                            <a th:href="@{/employees/edit/{id}(id=${employee.id})}" class="btn btn-outline-primary btn-sm px-3">
                                <i class="fa-solid fa-user-pen me-1"></i> Edit
                            </a>
                            <form th:action="@{/employees/delete/{id}(id=${employee.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Are you sure you want to delete this employee?');">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
                                <button type="submit" class="btn btn-outline-danger btn-sm px-3">
                                    <i class="fa-solid fa-trash-can me-1"></i> Delete
                                </button>
                            </form>
                        </div>
                    </div>

                    <div class="card-body p-4">
                        <hr class="text-muted mt-0 mb-4">

                        <!-- Information Grid -->
                        <div class="row g-4 mb-4">
                            <div class="col-12 col-sm-6">
                                <label class="text-muted small text-uppercase fw-semibold">Email Address</label>
                                <div class="fs-6 fw-medium text-dark mt-1">
                                    <a th:href="'mailto:' + ${employee.email}" class="text-decoration-none text-dark hover-primary" 
                                       th:text="${employee.email}">jane.doe@company.com</a>
                                </div>
                            </div>
                            <div class="col-12 col-sm-6">
                                <label class="text-muted small text-uppercase fw-semibold">Phone Number</label>
                                <div class="fs-6 fw-medium text-dark mt-1" 
                                     th:text="${employee.phone != null and !#strings.isEmpty(employee.phone) ? employee.phone : 'N/A'}">+1 (555) 000-0000</div>
                            </div>

                            <div class="col-12 col-sm-6">
                                <label class="text-muted small text-uppercase fw-semibold">Department</label>
                                <div class="fs-6 fw-medium text-dark mt-1" th:text="${employee.department}">Engineering</div>
                            </div>
                            <div class="col-12 col-sm-6">
                                <label class="text-muted small text-uppercase fw-semibold">Position / Role</label>
                                <div class="fs-6 fw-medium text-dark mt-1" th:text="${employee.position}">Software Engineer</div>
                            </div>

                            <div class="col-12 col-sm-6">
                                <label class="text-muted small text-uppercase fw-semibold">Annual Salary</label>
                                <div class="fs-5 fw-bold text-success mt-1" 
                                     th:text="${employee.salary != null ? '$' + #numbers.formatDecimal(employee.salary, 1, 2) : 'Confidential'}">$85,000.00</div>
                            </div>
                            <div class="col-12 col-sm-6">
                                <label class="text-muted small text-uppercase fw-semibold">Hire Date</label>
                                <div class="fs-6 fw-medium text-dark mt-1" 
                                     th:text="${employee.hireDate != null ? #temporals.format(employee.hireDate, 'MMM dd, yyyy') : (employee.hireDate != null ? employee.hireDate : 'N/A')}">Jan 15, 2024</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
