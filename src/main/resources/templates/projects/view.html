<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
      layout:decorate="~{layout}">
<head>
    <title th:text="${project.name != null ? project.name + ' - Project Details' : 'Project Details'}">Project Details</title>
</head>
<body>
    <div layout:fragment="content">
        <!-- Breadcrumb / Back button -->
        <div class="mb-4">
            <a th:href="@{/projects}" class="btn btn-outline-secondary btn-sm">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Projects List
            </a>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <!-- Detail Card -->
                <div class="card border-0 rounded-4 shadow-sm overflow-hidden">
                    <div class="card-header bg-white border-0 pt-4 px-4 pb-0 d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3">
                        <div class="d-flex align-items-center gap-3">
                            <div class="rounded-3 bg-purple-subtle text-purple p-3">
                                <i class="fa-solid fa-project-diagram fa-2x"></i>
                            </div>
                            <div>
                                <h3 class="fw-bold text-dark mb-1" th:text="${project.name}">Project Alpha</h3>
                                <div class="d-flex align-items-center gap-2">
                                    <span th:if="${project.client != null}" class="badge bg-light text-dark border" 
                                          th:text="${project.client.companyName}">Client Corp</span>
                                    <span th:if="${project.status != null and project.status.name() == 'ACTIVE'}" class="badge bg-success">Active</span>
                                    <span th:if="${project.status != null and project.status.name() == 'IN_PROGRESS'}" class="badge bg-primary">In Progress</span>
                                    <span th:if="${project.status != null and project.status.name() == 'COMPLETED'}" class="badge bg-success">Completed</span>
                                    <span th:if="${project.status != null and project.status.name() == 'NOT_STARTED'}" class="badge bg-secondary">Not Started</span>
                                    <span th:if="${project.status != null and project.status.name() == 'ON_HOLD'}" class="badge bg-warning text-dark">On Hold</span>
                                    <span th:if="${project.status != null and project.status.name() == 'CANCELLED'}" class="badge bg-danger">Cancelled</span>

                                    <span th:if="${project.priority != null and project.priority.name() == 'LOW'}" class="badge bg-info text-dark">Low Priority</span>
                                    <span th:if="${project.priority != null and project.priority.name() == 'MEDIUM'}" class="badge bg-primary">Medium Priority</span>
                                    <span th:if="${project.priority != null and project.priority.name() == 'HIGH'}" class="badge bg-warning text-dark">High Priority</span>
                                    <span th:if="${project.priority != null and project.priority.name() == 'URGENT'}" class="badge bg-danger">Urgent</span>
                                </div>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="d-flex gap-2">
                            <a th:href="@{/projects/edit/{id}(id=${project.id})}" class="btn btn-outline-primary btn-sm px-3">
                                <i class="fa-solid fa-pen-to-square me-1"></i> Edit
                            </a>
                            <form th:action="@{/projects/delete/{id}(id=${project.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Are you sure you want to delete this project?');">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
                                <button type="submit" class="btn btn-outline-danger btn-sm px-3">
                                    <i class="fa-solid fa-trash-can me-1"></i> Delete
                                </button>
                            </form>
                        </div>
                    </div>

                    <div class="card-body p-4">
                        <hr class="text-muted mt-0 mb-4">

                        <!-- Information Grid -->
                        <div class="row g-4 mb-4">
                            <div class="col-12 col-sm-6">
                                <label class="text-muted small text-uppercase fw-semibold">Client Company</label>
                                <div class="fs-6 fw-medium text-dark mt-1" 
                                     th:text="${project.client != null ? project.client.companyName : 'No Client Assigned'}">Acme Inc.</div>
                            </div>
                            <div class="col-12 col-sm-6">
                                <label class="text-muted small text-uppercase fw-semibold">Budget Allocated</label>
                                <div class="fs-5 fw-bold text-success mt-1" 
                                     th:text="${project.budget != null ? '$' + #numbers.formatDecimal(project.budget, 1, 2) : 'Not Specified'}">$50,000.00</div>
                            </div>

                            <div class="col-12 col-sm-6">
                                <label class="text-muted small text-uppercase fw-semibold">Kickoff / Start Date</label>
                                <div class="fs-6 fw-medium text-dark mt-1" 
                                     th:text="${project.startDate != null ? #temporals.format(project.startDate, 'MMMM dd, yyyy') : (project.startDate != null ? project.startDate : 'N/A')}">October 1, 2026</div>
                            </div>
                            <div class="col-12 col-sm-6">
                                <label class="text-muted small text-uppercase fw-semibold">Target Completion Date</label>
                                <div class="fs-6 fw-medium text-dark mt-1" 
                                     th:text="${project.endDate != null ? #temporals.format(project.endDate, 'MMMM dd, yyyy') : (project.endDate != null ? project.endDate : 'N/A')}">December 31, 2026</div>
                            </div>
                        </div>

                        <!-- Scope & Description -->
                        <div class="mb-4">
                            <label class="text-muted small text-uppercase fw-semibold">Description & Objectives</label>
                            <div class="p-3 bg-light rounded-3 text-secondary mt-1 lh-lg" 
                                 th:text="${project.description != null and !#strings.isEmpty(project.description) ? project.description : 'No project description provided.'}">
                                Full description details here.
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
