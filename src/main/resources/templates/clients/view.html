<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
      layout:decorate="~{layout}">
<head>
    <title th:text="${client.companyName != null ? client.companyName + ' - Client Details' : 'Client Details'}">Client Details</title>
</head>
<body>
    <div layout:fragment="content">
        <!-- Breadcrumb / Back button -->
        <div class="mb-4">
            <a th:href="@{/clients}" class="btn btn-outline-secondary btn-sm">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Clients List
            </a>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <!-- Detail Card -->
                <div class="card border-0 rounded-4 shadow-sm overflow-hidden">
                    <div class="card-header bg-white border-0 pt-4 px-4 pb-0 d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3">
                        <div class="d-flex align-items-center gap-3">
                            <div class="rounded-3 bg-warning bg-opacity-10 text-warning-emphasis p-3">
                                <i class="fa-solid fa-handshake fa-2x"></i>
                            </div>
                            <div>
                                <h3 class="fw-bold text-dark mb-1" th:text="${client.companyName}">Acme Corporation</h3>
                                <div class="d-flex align-items-center gap-2">
                                    <span class="badge bg-light text-dark border" th:text="${client.industry}">Technology</span>
                                    <span th:if="${client.status != null and client.status.name() == 'ACTIVE'}" class="badge bg-success">Active</span>
                                    <span th:if="${client.status != null and client.status.name() == 'INACTIVE'}" class="badge bg-danger">Inactive</span>
                                    <span th:if="${client.status != null and client.status.name() == 'PROSPECT'}" class="badge bg-info text-dark">Prospect</span>
                                    <span th:if="${client.status != null and client.status.name() == 'LEAD'}" class="badge bg-warning text-dark">Lead</span>
                                </div>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="d-flex gap-2">
                            <a th:href="@{/clients/edit/{id}(id=${client.id})}" class="btn btn-outline-primary btn-sm px-3">
                                <i class="fa-solid fa-pen-to-square me-1"></i> Edit
                            </a>
                            <form th:action="@{/clients/delete/{id}(id=${client.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Are you sure you want to delete this client?');">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
                                <button type="submit" class="btn btn-outline-danger btn-sm px-3">
                                    <i class="fa-solid fa-trash-can me-1"></i> Delete
                                </button>
                            </form>
                        </div>
                    </div>

                    <div class="card-body p-4">
                        <hr class="text-muted mt-0 mb-4">

                        <!-- Information Grid -->
                        <div class="row g-4 mb-4">
                            <div class="col-12 col-sm-6">
                                <label class="text-muted small text-uppercase fw-semibold">Primary Contact</label>
                                <div class="fs-6 fw-medium text-dark mt-1" th:text="${client.contactPerson}">John Smith</div>
                            </div>
                            <div class="col-12 col-sm-6">
                                <label class="text-muted small text-uppercase fw-semibold">Email Address</label>
                                <div class="fs-6 fw-medium text-dark mt-1">
                                    <a th:href="'mailto:' + ${client.email}" class="text-decoration-none text-dark hover-primary" 
                                       th:text="${client.email}">contact@acme.com</a>
                                </div>
                            </div>

                            <div class="col-12 col-sm-6">
                                <label class="text-muted small text-uppercase fw-semibold">Phone Number</label>
                                <div class="fs-6 fw-medium text-dark mt-1" 
                                     th:text="${client.phone != null and !#strings.isEmpty(client.phone) ? client.phone : 'N/A'}">+1 (555) 123-4567</div>
                            </div>
                            <div class="col-12 col-sm-6">
                                <label class="text-muted small text-uppercase fw-semibold">Industry Sector</label>
                                <div class="fs-6 fw-medium text-dark mt-1" th:text="${client.industry}">Technology</div>
                            </div>
                        </div>

                        <!-- Address Section -->
                        <div class="mb-4">
                            <label class="text-muted small text-uppercase fw-semibold">Business Address</label>
                            <div class="p-3 bg-light rounded-3 text-secondary mt-1 lh-lg" 
                                 th:text="${client.address != null and !#strings.isEmpty(client.address) ? client.address : 'No address specified.'}">
                                123 Business Way, Suite 400, San Francisco, CA
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
