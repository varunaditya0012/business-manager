<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
      layout:decorate="~{layout}">
<head>
    <title th:text="${client.id == null ? 'Add Client' : 'Edit Client'}">Client Form</title>
</head>
<body>
    <div layout:fragment="content">
        <!-- Form Header -->
        <div class="d-flex align-items-center justify-content-between mb-4">
            <div>
                <a th:href="@{/clients}" class="btn btn-outline-secondary btn-sm mb-2">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to Clients
                </a>
                <h2 class="fw-bold text-dark mb-1" th:text="${client.id == null ? 'Add New Client' : 'Edit Client'}">Client Form</h2>
                <p class="text-muted mb-0">Record company profile, contacts, and account status</p>
            </div>
        </div>

        <!-- Form Card -->
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="card border-0 rounded-4 shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <form th:action="@{/clients/save}" th:object="${client}" method="post" class="needs-validation" novalidate>
                            <!-- Hidden inputs for ID and CSRF -->
                            <input type="hidden" th:field="*{id}" />
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>

                            <!-- Company Name -->
                            <div class="mb-4">
                                <label for="companyName" class="form-label fw-semibold text-dark">Company Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control form-control-lg" id="companyName" th:field="*{companyName}" 
                                       placeholder="e.g. Acme Corporation" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}"></div>
                            </div>

                            <!-- Contact Person and Email -->
                            <div class="row g-3 mb-4">
                                <div class="col-12 col-md-6">
                                    <label for="contactPerson" class="form-label fw-semibold text-dark">Contact Person <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="contactPerson" th:field="*{contactPerson}" 
                                           placeholder="e.g. John Smith" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('contactPerson')}" th:errors="*{contactPerson}"></div>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="email" class="form-label fw-semibold text-dark">Email Address <span class="text-danger">*</span></label>
                                    <input type="email" class="form-control" id="email" th:field="*{email}" 
                                           placeholder="contact@acme.com" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                </div>
                            </div>

                            <!-- Phone and Industry -->
                            <div class="row g-3 mb-4">
                                <div class="col-12 col-md-6">
                                    <label for="phone" class="form-label fw-semibold text-dark">Phone Number</label>
                                    <input type="tel" class="form-control" id="phone" th:field="*{phone}" 
                                           placeholder="+1 (555) 123-4567">
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="industry" class="form-label fw-semibold text-dark">Industry <span class="text-danger">*</span></label>
                                    <select class="form-select" id="industry" th:field="*{industry}" required>
                                        <option value="" disabled selected>Select industry</option>
                                        <option value="Technology">Technology</option>
                                        <option value="Healthcare">Healthcare</option>
                                        <option value="Finance">Finance</option>
                                        <option value="Education">Education</option>
                                        <option value="Manufacturing">Manufacturing</option>
                                        <option value="Retail">Retail</option>
                                        <option value="Other">Other</option>
                                    </select>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('industry')}" th:errors="*{industry}"></div>
                                </div>
                            </div>

                            <!-- Status -->
                            <div class="mb-4">
                                <label for="status" class="form-label fw-semibold text-dark">Status <span class="text-danger">*</span></label>
                                <select class="form-select" id="status" th:field="*{status}" required>
                                    <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}">PROSPECT</option>
                                </select>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                            </div>

                            <!-- Address -->
                            <div class="mb-4">
                                <label for="address" class="form-label fw-semibold text-dark">Business Address</label>
                                <textarea class="form-control" id="address" th:field="*{address}" rows="3" 
                                          placeholder="Street address, city, state, postal code, country..."></textarea>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                            </div>

                            <hr class="my-4 text-muted">

                            <!-- Action Buttons -->
                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/clients}" class="btn btn-outline-secondary px-4">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                    <i class="fa-solid fa-floppy-disk me-1"></i> Save Client
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
