<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Business Tool Manager</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5.3 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome 6 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-bg d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                <div class="card auth-card shadow-lg border-0 rounded-4">
                    <div class="card-body p-4 p-sm-5">
                        <!-- Brand Header -->
                        <div class="text-center mb-4">
                            <div class="auth-brand-icon mb-2">
                                <i class="fa-solid fa-briefcase"></i>
                            </div>
                            <h3 class="fw-bold text-dark m-0">BizTools</h3>
                            <p class="text-muted small">Sign in to manage your business tools</p>
                        </div>

                        <!-- Alerts -->
                        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center mb-3 py-2 px-3" role="alert">
                            <i class="fa-solid fa-circle-exclamation me-2"></i>
                            <div class="small">Invalid username or password. Please try again.</div>
                            <button type="button" class="btn-close ms-auto p-2" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show d-flex align-items-center mb-3 py-2 px-3" role="alert">
                            <i class="fa-solid fa-circle-check me-2"></i>
                            <div class="small">You have been logged out successfully.</div>
                            <button type="button" class="btn-close ms-auto p-2" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show d-flex align-items-center mb-3 py-2 px-3" role="alert">
                            <i class="fa-solid fa-circle-check me-2"></i>
                            <div class="small" th:text="${successMessage}">Registration successful!</div>
                            <button type="button" class="btn-close ms-auto p-2" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <!-- Login Form -->
                        <form th:action="@{/login}" method="post" class="needs-validation" novalidate>
                            <!-- Hidden CSRF token if present -->
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>

                            <!-- Username Input -->
                            <div class="mb-3">
                                <label for="username" class="form-label text-dark fw-medium small">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted">
                                        <i class="fa-solid fa-user"></i>
                                    </span>
                                    <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" 
                                           placeholder="Enter username" required autofocus>
                                </div>
                            </div>

                            <!-- Password Input -->
                            <div class="mb-3">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <label for="password" class="form-label text-dark fw-medium small mb-0">Password</label>
                                </div>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted">
                                        <i class="fa-solid fa-lock"></i>
                                    </span>
                                    <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" 
                                           placeholder="Enter password" required>
                                </div>
                            </div>

                            <!-- Remember Me Checkbox -->
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe" name="remember-me">
                                    <label class="form-check-label text-muted small" for="rememberMe">
                                        Remember me
                                    </label>
                                </div>
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary btn-lg fw-semibold shadow-sm login-btn">
                                    <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In
                                </button>
                            </div>

                            <!-- Register Link -->
                            <div class="text-center">
                                <span class="text-muted small">Don't have an account? </span>
                                <a th:href="@{/register}" class="text-primary small fw-semibold text-decoration-none hover-underline">
                                    Create Account
                                </a>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Footer note -->
                <div class="text-center mt-4 text-white-50 small">
                    &copy; 2026 BizTools. All rights reserved.
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
