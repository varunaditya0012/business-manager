<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
      layout:decorate="~{layout}">
<head>
    <title th:text="${tool.name != null ? tool.name + ' - Tool Details' : 'Tool Details'}">Tool Details</title>
</head>
<body>
    <div layout:fragment="content">
        <!-- Breadcrumb / Back button -->
        <div class="mb-4">
            <a th:href="@{/tools}" class="btn btn-outline-secondary btn-sm">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Tools List
            </a>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <!-- Detail Card -->
                <div class="card border-0 rounded-4 shadow-sm overflow-hidden">
                    <div class="card-header bg-white border-0 pt-4 px-4 pb-0 d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3">
                        <div class="d-flex align-items-center gap-3">
                            <div class="rounded-3 bg-primary bg-opacity-10 text-primary p-3">
                                <i class="fa-solid fa-wrench fa-2x"></i>
                            </div>
                            <div>
                                <h3 class="fw-bold text-dark mb-1" th:text="${tool.name}">Tool Name</h3>
                                <div class="d-flex align-items-center gap-2">
                                    <span class="badge bg-light text-dark border" th:text="${tool.category}">Category</span>
                                    <span th:if="${tool.status != null and tool.status.name() == 'ACTIVE'}" class="badge bg-success">Active</span>
                                    <span th:if="${tool.status != null and tool.status.name() == 'INACTIVE'}" class="badge bg-danger">Inactive</span>
                                    <span th:if="${tool.status != null and tool.status.name() == 'MAINTENANCE'}" class="badge bg-warning text-dark">Maintenance</span>
                                    <span th:if="${tool.status != null and tool.status.name() == 'DEPRECATED'}" class="badge bg-secondary">Deprecated</span>
                                </div>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="d-flex gap-2">
                            <a th:href="@{/tools/edit/{id}(id=${tool.id})}" class="btn btn-outline-primary btn-sm px-3">
                                <i class="fa-solid fa-pen-to-square me-1"></i> Edit
                            </a>
                            <form th:action="@{/tools/delete/{id}(id=${tool.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Are you sure you want to delete this tool?');">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
                                <button type="submit" class="btn btn-outline-danger btn-sm px-3">
                                    <i class="fa-solid fa-trash-can me-1"></i> Delete
                                </button>
                            </form>
                        </div>
                    </div>

                    <div class="card-body p-4">
                        <hr class="text-muted mt-0 mb-4">

                        <!-- Information Grid -->
                        <div class="row g-4 mb-4">
                            <div class="col-12 col-sm-6">
                                <label class="text-muted small text-uppercase fw-semibold">Offered By / Registered By</label>
                                <div class="fs-6 fw-medium text-dark mt-1" th:text="${tool.offeredBy != null ? (tool.offeredBy.fullName != null and !tool.offeredBy.fullName.isEmpty() ? tool.offeredBy.fullName : tool.offeredBy.username) : 'N/A'}">Microsoft</div>
                            </div>
                            <div class="col-12 col-sm-6">
                                <label class="text-muted small text-uppercase fw-semibold">Price / License Cost</label>
                                <div class="fs-5 fw-bold text-success mt-1" th:text="${tool.price != null ? '$' + #numbers.formatDecimal(tool.price, 1, 2) : 'Free'}">$0.00</div>
                            </div>
                        </div>

                        <!-- Description Section -->
                        <div class="mb-4">
                            <label class="text-muted small text-uppercase fw-semibold">Description</label>
                            <div class="p-3 bg-light rounded-3 text-secondary mt-1 lh-lg" 
                                 th:text="${tool.description != null and !#strings.isEmpty(tool.description) ? tool.description : 'No description provided.'}">
                                Tool description goes here.
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
