<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Access Denied - Business Tool Manager</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5.3 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome 6 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-bg d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
                <div class="card auth-card shadow-lg border-0 rounded-4 text-center p-4 p-sm-5">
                    <div class="card-body">
                        <!-- Lock Icon -->
                        <div class="access-denied-icon mb-4">
                            <span class="rounded-circle bg-danger bg-opacity-10 text-danger p-4 d-inline-block">
                                <i class="fa-solid fa-shield-halved fa-4x"></i>
                            </span>
                        </div>

                        <!-- Error Code & Title -->
                        <h1 class="display-5 fw-bold text-dark mb-1">403</h1>
                        <h3 class="fw-bold text-danger mb-3">Access Denied</h3>

                        <p class="text-muted mb-4">
                            You do not have the required permissions or administrative privileges to view this resource. 
                            If you believe this is a mistake, please reach out to your system administrator.
                        </p>

                        <!-- Action buttons -->
                        <div class="d-flex justify-content-center gap-2">
                            <a th:href="@{/dashboard}" class="btn btn-primary px-4 py-2 fw-semibold shadow-sm">
                                <i class="fa-solid fa-house me-2"></i>Go to Dashboard
                            </a>
                            <a th:href="@{/login}" class="btn btn-outline-secondary px-4 py-2">
                                <i class="fa-solid fa-right-to-bracket me-2"></i>Re-login
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Footer note -->
                <div class="text-center mt-4 text-white-50 small">
                    &copy; 2026 Business Tool Manager. All rights reserved.
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
